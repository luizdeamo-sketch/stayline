<script>
  // tema e idioma antes de pintar (mesmas chaves do sistema completo)
  (function(){ try{
    var th = localStorage.getItem('sl_tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = th;
    var lg = localStorage.getItem('sl_idioma') || ((navigator.language||'pt').toLowerCase().indexOf('pt')===0 ? 'pt' : 'en');
    document.documentElement.lang = lg === 'pt' ? 'pt-BR' : 'en';
  }catch(e){ document.documentElement.dataset.theme = 'light'; } })();
</script>
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --panel-2:#eef0f4; --ink:#0f172a; --ink-2:#475569; --ink-3:#64748b; --line:#e2e6ec; --line-2:#cbd2db;
  --brand:#14213d; --accent:#2f6bff; --accent-soft:#e6eeff; --amber-acc:#f4a73b;
  --ok:#15803d; --ok-soft:#dcf2e3; --mid:#b45309; --mid-soft:#fcefd9; --bad:#c2321f; --bad-soft:#fde4df;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 2px 8px rgba(15,23,42,.06); --shadow-lg:0 -12px 40px rgba(15,23,42,.18);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --fm:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b0f16; --panel:#141a24; --panel-2:#1b2230; --ink:#e8edf4; --ink-2:#aab4c3; --ink-3:#8792a3; --line:#242d3b; --line-2:#334054;
  --brand:#0a0f18; --accent:#7aa2ff; --accent-soft:#1b2848;
  --ok:#5fd08a; --ok-soft:#133020; --mid:#f2b25c; --mid-soft:#3a2a12; --bad:#ff8a78; --bad-soft:#3d1c17;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 -12px 40px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;min-height:100vh;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + var(--st)) 20px calc(24px + var(--sb));background:radial-gradient(900px 420px at 0% -10%, var(--accent-soft), transparent 60%), var(--bg)}
.lg-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 22px;box-shadow:var(--shadow);display:grid;gap:14px}
.lg-brand{display:flex;gap:12px;align-items:center} .lg-brand img{width:46px;height:46px;border-radius:12px}
.lg-brand b{font-size:20px;letter-spacing:-.01em;display:block} .lg-brand span{color:var(--ink-3);font-size:13px}
.fld{display:grid;gap:6px} .fld span{font-size:13px;color:var(--ink-2);font-weight:600}
.fld input{height:48px;border:1px solid var(--line-2);border-radius:12px;padding:0 14px;background:var(--panel);font-size:16px}
.btn{height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--panel);font-weight:600;font-size:15px;padding:0 16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0b1020}
.btn:disabled{opacity:.6}
.lnk{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;font-size:14px;text-align:left}
.msg{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px}
.msg.ok{background:var(--ok-soft);color:var(--ok)}

/* ---------- topo ---------- */
.hd{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--bg) 86%, transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);padding:calc(10px + var(--st)) calc(16px + var(--sr)) 0 calc(16px + var(--sl));border-bottom:1px solid transparent;transition:border-color .2s}
.hd.rolou{border-bottom-color:var(--line)}
.hd-l{display:flex;align-items:center;gap:10px;min-height:44px}
.hd-l img{width:32px;height:32px;border-radius:9px;flex:none}
.hd-t{flex:1;min-width:0} .hd-t b{display:block;font-size:17px;letter-spacing:-.01em} .hd-t span{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none;padding:0}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i-sol{display:none} :root[data-theme="dark"] .i-sol{display:block} :root[data-theme="dark"] .i-lua{display:none}
.ib.girando svg{animation:gira .9s linear infinite} @keyframes gira{to{transform:rotate(360deg)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);height:40px;flex:none}
.seg button{border:0;background:none;padding:0 10px;font-size:13px;font-weight:700;color:var(--ink-3);min-width:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* ---------- dias ---------- */
.dias{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 0 12px;margin:0 calc(-16px - var(--sr)) 0 calc(-16px - var(--sl));padding-left:calc(16px + var(--sl));padding-right:calc(16px + var(--sr));scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{scroll-snap-align:start;flex:0 0 auto;min-width:64px;height:66px;border-radius:16px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;align-content:center;gap:1px;padding:6px 8px;box-shadow:var(--shadow)}
.dia small{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:capitalize} .dia b{font-size:19px;line-height:1.1}
.dia i{width:22px;height:4px;border-radius:2px;background:var(--line-2)}
.dia i.f-alta{background:var(--ok)} .dia i.f-media{background:var(--mid)} .dia i.f-baixa{background:var(--bad)}
.dia[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)} .dia[aria-selected="true"] small{color:color-mix(in srgb, var(--panel) 75%, transparent)}

/* ---------- conteúdo ---------- */
main{padding:4px calc(16px + var(--sr)) calc(28px + var(--sb)) calc(16px + var(--sl));display:grid;gap:14px;max-width:720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.res{padding:16px;display:grid;gap:14px}
.res-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.anel{width:118px;height:118px;position:relative;flex:none}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)} .anel circle{fill:none;stroke-width:11}
.anel .fundo{stroke:var(--panel-2)} .anel .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1), stroke .3s}
.anel div{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center}
.anel b{font-size:27px;letter-spacing:-.02em;line-height:1} .anel span{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.stats{display:grid;gap:8px;min-width:0}
.st{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:6px} .st:last-child{border-bottom:0;padding-bottom:0}
.st span{color:var(--ink-2);font-size:14px} .st b{font-size:20px} .st b em{font-style:normal;font-size:12.5px;color:var(--ink-3);font-weight:600;margin-left:4px}
.st.livre b{color:var(--ok)}
.res-bot{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;border-radius:999px;padding:0 12px;background:var(--panel-2);font-size:13.5px;font-weight:600;color:var(--ink-2);border:0}
.pill b{color:var(--ink)} .pill.alerta{background:var(--bad-soft);color:var(--bad)} .pill.alerta b{color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.tag-ex{font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;background:var(--mid-soft);color:var(--mid);border-radius:6px;padding:2px 6px}

.filtros{display:grid;gap:10px}
.busca{position:relative} .busca svg{position:absolute;left:13px;top:50%;width:18px;height:18px;transform:translateY(-50%);stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round}
.busca input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:0 42px 0 40px;font-size:16px;box-shadow:var(--shadow)}
.busca .limpa{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;color:var(--ink-3);font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-16px - var(--sr)) 0 calc(-16px - var(--sl));padding:0 calc(16px + var(--sr)) 2px calc(16px + var(--sl))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--panel);padding:0 14px;font-weight:600;font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip b{font-size:12.5px;color:var(--ink-3)} .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)} .chip[aria-pressed="true"] b{color:color-mix(in srgb, var(--panel) 70%, transparent)}
.linha-b{display:flex;gap:8px} .linha-b .busca{flex:1;min-width:0}
.base-sel{position:relative;flex:none;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);display:flex;align-items:center}
.base-sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;height:100%;padding:0 30px 0 14px;font-weight:650;font-size:16px;max-width:116px;text-overflow:ellipsis}
.base-sel svg{position:absolute;right:9px;width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2.2;pointer-events:none}
.base-sel.on{background:var(--ink);border-color:var(--ink);color:var(--panel)} .base-sel.on svg{stroke:var(--panel)}

.grupo{display:grid;gap:8px}
.g-h{display:flex;align-items:center;gap:8px;padding:6px 4px 0}
.g-h b{font-family:var(--fm);font-size:13px;background:var(--panel-2);border-radius:7px;padding:2px 7px} .g-h span{color:var(--ink-3);font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-h em{font-style:normal;font-size:13px;color:var(--ink-3);font-weight:500} .g-h em b{font-size:13.5px;background:none;padding:0;color:var(--ink-2)}
.ht{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:13px 14px 12px;display:grid;gap:9px;box-shadow:var(--shadow);transition:transform .12s}
.ht:active{transform:scale(.985)}
.ht-1{display:flex;align-items:flex-start;gap:10px}
.ht-n{flex:1;min-width:0;font-weight:650;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ht-n small{display:block;font-weight:500;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.ht-q{flex:none;text-align:right;line-height:1.1} .ht-q b{font-size:22px;letter-spacing:-.02em} .ht-q span{display:block;font-size:11.5px;color:var(--ink-3)}
.ht.f-alta .ht-q b{color:var(--ok)} .ht.f-media .ht-q b{color:var(--mid)} .ht.f-baixa .ht-q b{color:var(--bad)}
.barra{height:8px;border-radius:5px;background:var(--panel-2);overflow:hidden} .barra i{display:block;height:100%;border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.f-alta .barra i,.barra i.f-alta{background:var(--ok)} .f-media .barra i,.barra i.f-media{background:var(--mid)} .f-baixa .barra i,.barra i.f-baixa{background:var(--bad)}
.sem{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sem span{height:20px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--ink-3);background:var(--panel-2);position:relative}
.sem span.f-alta{background:var(--ok-soft);color:var(--ok)} .sem span.f-media{background:var(--mid-soft);color:var(--mid)} .sem span.f-baixa{background:var(--bad-soft);color:var(--bad)}
.sem span.on{box-shadow:0 0 0 2px var(--ink)}
.aviso{display:inline-block;font-size:11.5px;font-weight:700;color:var(--mid);background:var(--mid-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.vazio{padding:28px 16px;text-align:center;color:var(--ink-3)}
.rod{color:var(--ink-3);font-size:12.5px;text-align:center;display:grid;gap:6px;padding-top:4px}
.rod a{color:var(--accent);font-weight:600;text-decoration:none}

/* esqueleto enquanto carrega */
.sk{background:linear-gradient(90deg, var(--panel-2) 0%, var(--line) 50%, var(--panel-2) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- ficha (folha de baixo) ---------- */
.fundo-sh{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:60;opacity:0;transition:opacity .25s}
.fundo-sh.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--panel);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sh-pega{padding:10px 0 4px;display:grid;place-items:center;touch-action:none} .sh-pega i{width:40px;height:5px;border-radius:3px;background:var(--line-2)}
.sh-h{display:flex;gap:10px;align-items:flex-start;padding:4px 18px 10px}
.sh-h div{flex:1;min-width:0} .sh-h b{font-size:18px;line-height:1.25;display:block} .sh-h span{color:var(--ink-3);font-size:13.5px}
.sh-b{overflow:auto;padding:0 18px calc(18px + var(--sb));display:grid;gap:14px;-webkit-overflow-scrolling:touch}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--panel-2);border-radius:12px;padding:9px 11px} .kv small{display:block;color:var(--ink-3);font-size:12px} .kv b{font-size:15px}
.noites{display:grid;gap:8px}
.nt{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center}
.nt span{font-size:13px;color:var(--ink-2);text-transform:capitalize} .nt b{font-size:14px;min-width:76px;text-align:right} .nt b em{font-style:normal;color:var(--ink-3);font-weight:500}
.nt.on span{color:var(--ink);font-weight:700}
.sh-tit{font-size:12.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sb));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 16px;border-radius:12px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}
@media (min-width:640px){ #lista{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;align-items:start} #lista > .card.vazio{grid-column:1 / -1} .lista-cols{display:grid;gap:8px} #lista > .lista-cols{grid-column:1 / -1;grid-template-columns:1fr 1fr} }
@media (max-width:370px){
  .hd-l{gap:7px} .hd-l img{width:28px;height:28px} .hd-t b{font-size:16px}
  .ib{width:36px;height:36px;border-radius:11px} .seg{height:36px} .seg button{min-width:32px;padding:0 7px;font-size:12px}
  .anel{width:96px;height:96px} .anel b{font-size:22px} .res-top{gap:12px} .st b{font-size:18px} .st span{font-size:13.5px}
  .base-sel select{max-width:92px;padding:0 26px 0 11px} .dia{min-width:58px;height:62px}
  .ht-q b{font-size:20px} .sem{gap:3px} .sem span{font-size:10px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
</style>
</head>
<body>
<!-- login -->
<div class="login" id="login" hidden>
  <div class="lg-card">
    <div class="lg-brand"><img src="icon-192.png" alt=""><div><b>Stayline</b><span data-t="sub"></span></div></div>
    <div id="lg-entrar" class="fld" style="gap:12px">
      <label class="fld"><span data-t="email"></span><input id="lg-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"></label>
      <label class="fld"><span data-t="senha"></span><input id="lg-senha" type="password" autocomplete="current-password"></label>
      <button class="btn pri" id="lg-btn" type="button" data-t="entrar"></button>
      <button class="lnk" id="lg-pa" type="button" data-t="primeiro"></button>
    </div>
    <div id="lg-criar" class="fld" style="gap:12px" hidden>
      <p style="margin:0;color:var(--ink-2);font-size:14px" data-t="pa_txt"></p>
      <label class="fld"><span data-t="email"></span><input id="pa-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false"></label>
      <label class="fld"><span data-t="nova_senha"></span><input id="pa-senha" type="password" autocomplete="new-password" minlength="10"></label>
      <button class="btn pri" id="pa-btn" type="button" data-t="criar"></button>
      <button class="lnk" id="pa-voltar" type="button" data-t="voltar"></button>
    </div>
    <div class="msg" id="lg-msg" role="alert" hidden></div>
  </div>
</div>

<!-- app -->
<div id="app" hidden>
  <header class="hd" id="hd">
    <div class="hd-l">
      <img src="icon-192.png" alt="">
      <div class="hd-t"><b data-t="titulo"></b><span id="hd-sub"></span></div>
      <div class="seg" role="group" aria-label="Idioma / Language"><button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button></div>
      <button class="ib" type="button" id="b-tema"><svg viewBox="0 0 24 24" class="i-lua"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg viewBox="0 0 24 24" class="i-sol"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="ib" type="button" id="b-atual"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    </div>
    <nav class="dias" id="dias" role="tablist"></nav>
  </header>
  <main>
    <section class="card res" id="res" aria-live="polite"></section>
    <section class="filtros">

const ls = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
const M = { lang: ls.get('sl_idioma', (navigator.language||'pt').toLowerCase().indexOf('pt')===0 ? 'pt' : 'en'), email:'', dia:0, filtro:'todos', base:ls.get('sl_m_base',''), busca:'',

const $ = s=> document.querySelector(s);
const t = (k, v)=>{ let s = (T[M.lang]||T.pt)[k] || T.pt[k] || k; if(v) s = s.replace(/\{(\w+)\}/g, (_,n)=> v[n]!=null ? v[n] : ''); return s; };
const esc = s=> String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const noiteN = i=>{ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+i); return iso(d); };
const dataN = i=>{ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+i); return d; };
const moeda = (v, m)=> v==null ? '—' : Number(v).toLocaleString(loc(), { style:'currency', currency:m||'BRL' });
const sem = s=> String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toast.tm); toast.tm = setTimeout(()=> el.hidden = true, 2600); }

/* ---------- registro de uso (o mesmo do sistema completo, rota "celular") ---------- */
const SESSAO = Math.random().toString(36).slice(2,10);
function uso(tipo, alvo, detalhe){ if(!M.email) return; sb.from('prn_uso_eventos').insert({ email:M.email, em:new Date().toISOString(), sessao:SESSAO, tipo, rota:'celular', alvo:alvo||null, detalhe:detalhe||{} }).then(()=>{}, ()=>{}); }

/* ---------- textos fixos e idioma ---------- */
function aplicarIdioma(){
  document.documentElement.lang = M.lang==='pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-t]').forEach(el=> el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-lang]').forEach(b=> b.setAttribute('aria-pressed', String(b.dataset.lang===M.lang)));

}

/* ---------- login ---------- */
function telaLogin(msg, ok){ $('#app').hidden = true; $('#login').hidden = false; const m = $('#lg-msg'); m.hidden = !msg; m.textContent = msg||''; m.className = 'msg'+(ok?' ok':''); }
$('#lg-btn').addEventListener('click', entrar);
$('#lg-senha').addEventListener('keydown', e=>{ if(e.key==='Enter') entrar(); });
async function entrar(){ const b = $('#lg-btn'); b.disabled = true; const { error } = await sb.auth.signInWithPassword({ email:$('#lg-email').value.trim(), password:$('#lg-senha').value }); b.disabled = false; if(error) telaLogin(t('err_login')); }
$('#lg-pa').addEventListener('click', ()=>{ $('#lg-entrar').hidden = true; $('#lg-criar').hidden = false; $('#pa-email').value = $('#lg-email').value; $('#lg-msg').hidden = true; });
$('#pa-voltar').addEventListener('click', ()=>{ $('#lg-criar').hidden = true; $('#lg-entrar').hidden = false; $('#lg-msg').hidden = true; });
$('#pa-btn').addEventListener('click', async ()=>{
  const email = $('#pa-email').value.trim(), senha = $('#pa-senha').value, b = $('#pa-btn');
  if(senha.length < 10){ telaLogin(t('pa_senha_curta')); return; }
  b.disabled = true;
  try{ const r = await fetch(CONFIG.url+'/functions/v1/prn-primeiro-acesso', { method:'POST', headers:{ 'Content-Type':'application/json', apikey:CONFIG.anon }, body:JSON.stringify({ email, senha }) });
    const j = await r.json().catch(()=>({ code:'erro' }));
    if(!r.ok || !j.ok){ telaLogin(T.pt['pa_'+j.code] ? t('pa_'+j.code) : t('pa_erro')); b.disabled = false; return; }
    const { error } = await sb.auth.signInWithPassword({ email, password:senha }); if(error) telaLogin(t('err_login'));
  }catch(e){ telaLogin(t('pa_erro')); }
  b.disabled = false;
});

let iniciado = false;
sb.auth.onAuthStateChange((ev, s)=>{ setTimeout(()=> sessao(s), 0); });
sb.auth.getSession().then(({ data })=>{ if(!data.session) telaLogin(); });
async function sessao(s){
  if(!s){ iniciado = false; M.email = ''; telaLogin(); return; }
  const email = s.user.email.toLowerCase(); if(iniciado && M.email===email) return;
  const { data } = await sb.from('prn_membros').select('email,nome,papel,ativo').ilike('email', email).maybeSingle();
  if(!data || !data.ativo){ await sb.auth.signOut(); telaLogin(t('err_membro')); return; }
  M.email = email; iniciado = true; $('#login').hidden = true; $('#app').hidden = false;
  esqueleto(); await carregar(); uso('tela', null, { origem: matchMedia('(display-mode: standalone)').matches ? 'app' : 'link' });
}

/* ---------- dados ---------- */
async function carregar(manual){
  if(M.carregando) return; M.carregando = true; const b = $('#b-atual'); b.classList.add('girando');
  try{
    const ini = noiteN(0), fim = noiteN(DIAS-1);
    try{ await sb.rpc('prn_exemplo_rolar'); }catch(e){}
    const [h, bs, d, c] = await Promise.all([
      sb.from('prn_hoteis').select('id,base,nome,tipo,moeda,tarifa,tarifa_duplo,quartos_dia,duracao_h,minutos_local,release,cidade,uf,aviso,categoria,ativo').eq('ativo', true),
      sb.from('prn_bases').select('codigo,cidade,uf,ativo'),
      sb.from('prn_disponibilidade').select('hotel_id,noite,quartos_livres,fonte,atualizado_em').gte('noite', ini).lte('noite', fim),
      sb.rpc('prn_celular', { p_ini: ini, p_dias: DIAS }) ]);
    const erro = h.error || bs.error || d.error || c.error; if(erro) throw erro;
    M.hoteis = (h.data||[]).filter(x=> x.quartos_dia > 0);
    M.bases = (bs.data||[]).filter(x=> x.ativo !== false);
    M.disp = {}; (d.data||[]).forEach(r=> M.disp[r.hotel_id+'|'+r.noite] = r);
    M.usados = {}; ((c.data||{}).usados||[]).forEach(r=> M.usados[r.hotel_id+'|'+r.noite] = r.q);
    M.voos = (c.data||{}).voos || [];
    M.quando = new Date(); M.ultima = Date.now(); $('#res').hidden = false;
    if(M.base && !M.bases.some(x=>x.codigo===M.base)) M.base = '';
    desenhar(); if(manual) toast(t('ok_atual'));
  }catch(e){ console.warn(e); if(!M.hoteis.length){ $('#lista').innerHTML = `<div class="card vazio">${esc(t('erro'))}</div>`; $('#res').innerHTML = ''; $('#res').hidden = true; } toast(t('erro')); }
  finally{ M.carregando = false; b.classList.remove('girando'); }
}
const livres = (h, n)=>{ const d = M.disp[h.id+'|'+n], u = M.usados[h.id+'|'+n]||0; const cont = Math.max(0, h.quartos_dia - u); return d ? Math.min(d.quartos_livres, cont) : cont; };
const folga = (l, c)=> !c ? '' : l/c < 0.2 ? 'f-baixa' : l/c < 0.5 ? 'f-media' : 'f-alta';
const daBase = h=> !M.base || h.base===M.base;
const cidade = b=>{ const x = M.bases.find(y=>y.codigo===b); return x ? x.cidade : ''; };

/* ---------- desenho ---------- */
function esqueleto(){ aplicarIdioma(); $('#res').innerHTML = '<div class="sk" style="height:118px"></div>'; $('#lista').innerHTML = [1,2,3,4].map(()=>'<div class="sk" style="height:96px"></div>').join(''); }
function desenhar(){
  aplicarIdioma();
  const hs = M.hoteis.filter(daBase), n = noiteN(M.dia);
  // dias
  $('#dias').innerHTML = Array.from({length:DIAS}, (_,i)=>{ const nn = noiteN(i), d = dataN(i), cap = hs.reduce((a,h)=>a+h.quartos_dia,0), l = hs.reduce((a,h)=>a+livres(h,nn),0);
    const rot = i===0 ? t('hoje') : i===1 ? t('amanha') : d.toLocaleDateString(loc(), { weekday:'short' }).replace('.','');
    return `<button type="button" class="dia" role="tab" aria-selected="${i===M.dia}" data-dia="${i}" aria-label="${esc(d.toLocaleDateString(loc(), { weekday:'long', day:'numeric', month:'long' }))}"><small>${esc(rot)}</small><b class="mono">${d.getDate()}</b><i class="${folga(l,cap)}"></i></button>`; }).join('');
  // resumo da noite
  const cap = hs.reduce((a,h)=>a+h.quartos_dia,0), liv = hs.reduce((a,h)=>a+livres(h,n),0), oc = cap - liv, pc = cap ? Math.round(oc/cap*100) : 0;
  const ap = hs.filter(h=> folga(livres(h,n), h.quartos_dia)==='f-baixa').length;
  const vs = M.voos.filter(v=> v.noite===n && (!M.base || v.base===M.base)), gol = vs.reduce((a,v)=>a+v.gol,0), azul = vs.reduce((a,v)=>a+v.azul,0), ex = vs.some(v=>v.exemplo);
  const C = 2*Math.PI*42, cor = pc >= 80 ? 'var(--bad)' : pc >= 50 ? 'var(--mid)' : 'var(--accent)';
  $('#res').innerHTML = `<div class="res-top">
      <div class="anel" role="img" aria-label="${pc}% ${esc(t('ocupado'))}"><svg viewBox="0 0 100 100"><circle class="fundo" cx="50" cy="50" r="42"/><circle class="val" cx="50" cy="50" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="stroke:${cor}" data-off="${C*(1-pc/100)}"/></svg><div><b class="mono">${pc}%</b><span>${esc(t('ocupado'))}</span></div></div>
      <div class="stats"><div class="st livre"><span>${esc(t('livres'))}</span><b class="mono">${N(liv)}<em>${cap?Math.round(liv/cap*100):0}%</em></b></div><div class="st"><span>${esc(t('ocupados'))}</span><b class="mono">${N(oc)}</b></div><div class="st"><span>${esc(t('contratados'))}</span><b class="mono">${N(cap)}</b></div></div></div>
    <div class="res-bot"><span class="pill" title="${esc(t('voos_d'))}">✈ ${esc(t('voos_gol'))} <b class="mono">${N(gol)}</b> · ${esc(t('voos_azul'))} <b class="mono">${N(azul)}</b>${ex?` <span class="tag-ex">${esc(t('exemplo'))}</span>`:''}</span>
      ${ap ? `<button type="button" class="pill alerta" id="p-ap">▲ ${esc(t('apertados',{n:ap}))}</button>` : `<span class="pill ok">✓ ${esc(t('sem_apertados'))}</span>`}</div>`;
  requestAnimationFrame(()=> requestAnimationFrame(()=>{ const v = $('#res .val'); if(v) v.style.strokeDashoffset = v.dataset.off; }));
  // filtros
  const nAp = ap, nFo = hs.filter(h=> folga(livres(h,n), h.quartos_dia)==='f-alta').length;
  $('#chips').innerHTML = [['todos',t('todos'),hs.length],['apertados',t('f_apertados'),nAp],['folga',t('f_folga'),nFo]].map(([k,r,c])=>`<button type="button" class="chip" data-f="${k}" aria-pressed="${M.filtro===k}">${esc(r)} <b class="mono">${c}</b></button>`).join('')
    ;
  $('#sel-base').innerHTML = `<option value="">${esc(t('base_todas_curto'))}</option>${M.bases.filter(b=> M.hoteis.some(h=>h.base===b.codigo)).sort((a,b)=>a.codigo.localeCompare(b.codigo)).map(b=>`<option value="${esc(b.codigo)}" ${b.codigo===M.base?'selected':''}>${esc(b.codigo)} · ${esc(b.cidade)}</option>`).join('')}`;
  $('#sel-base').setAttribute('aria-label', t('todas_bases')); $('#base-sel').classList.toggle('on', !!M.base);
  // lista
  const q = sem(M.busca);
  let lista = hs.filter(h=> !q || sem([h.nome, h.base, h.cidade, cidade(h.base)].join(' ')).includes(q));
  if(M.filtro==='apertados') lista = lista.filter(h=> folga(livres(h,n), h.quartos_dia)==='f-baixa');
  if(M.filtro==='folga') lista = lista.filter(h=> folga(livres(h,n), h.quartos_dia)==='f-alta');
  const card = (h, comBase)=>{ const l = livres(h,n), f = folga(l, h.quartos_dia);
    const semana = Array.from({length:DIAS}, (_,i)=>{ const nn = noiteN(i), li = livres(h,nn); return `<span class="${folga(li,h.quartos_dia)}${i===M.dia?' on':''}">${li}</span>`; }).join('');
    return `<button type="button" class="ht ${f}" data-h="${h.id}" aria-label="${esc(h.nome)}: ${l} ${esc(t('livres_de',{c:h.quartos_dia}))}">
      <div class="ht-1"><div class="ht-n">${esc(h.nome)}${h.aviso?`<span class="aviso">⚠ ${esc(h.aviso)}</span>`:''}${comBase?`<small>${esc(h.base)} · ${esc(cidade(h.base))}</small>`:''}</div><div class="ht-q"><b class="mono">${l}</b><span>${esc(t('livres_de',{c:h.quartos_dia}))}</span></div></div>
      <div class="barra"><i style="width:${h.quartos_dia ? Math.round(l/h.quartos_dia*100) : 0}%"></i></div>
      <div class="sem" aria-hidden="true">${semana}</div></button>`; };
  let html = '';
  if(!lista.length) html = `<div class="card vazio">${esc(t('nada'))}</div>`;
  else if(M.filtro!=='todos' || q){ lista.sort((a,b)=> livres(a,n)/a.quartos_dia - livres(b,n)/b.quartos_dia || a.nome.localeCompare(b.nome)); html = `<div class="lista-cols">${lista.map(h=>card(h,true)).join('')}</div>`; }
  else { const porBase = {}; lista.forEach(h=> (porBase[h.base] = porBase[h.base] || []).push(h));
    html = Object.keys(porBase).sort().map(b=>{ const g = porBase[b].sort((x,y)=>x.nome.localeCompare(y.nome)), gc = g.reduce((a,h)=>a+h.quartos_dia,0), gl = g.reduce((a,h)=>a+livres(h,n),0);
      return `<div class="grupo"><div class="g-h"><b>${esc(b)}</b><span>${esc(cidade(b))}${g.length>1?' · '+esc(t('hotel_s',{n:g.length})):''}</span>${g.length>1?`<em><b class="mono">${gl}</b> ${esc(t('de_c',{c:gc}))}</em>`:''}</div><div class="lista-cols">${g.map(h=>card(h,false)).join('')}</div></div>`; }).join(''); }
  $('#lista').innerHTML = html;
  // rodapé
  const hh = M.quando ? M.quando.toLocaleTimeString(loc(), { hour:'2-digit', minute:'2-digit' }) : '';
  const dex = Object.values(M.disp).some(d=> /exemplo/.test(d.fonte||''));
  $('#hd-sub').textContent = dataN(M.dia).toLocaleDateString(loc(), { weekday:'short', day:'numeric', month:'short' }).replace(/\./g,'');
  $('#rod').innerHTML = `<span>${esc(t('atualizado',{h:hh}))}</span>${dex?`<span>${esc(t('disp_ex'))}</span>`:''}<span><a href="../#operacao">${esc(t('completo'))}</a> · <a href="#" id="b-sair">${esc(t('sair'))}</a></span>`;
}

/* ---------- ficha do hotel ---------- */
let ultimoFoco = null;
function abrirFicha(id){
  const h = M.hoteis.find(x=>x.id===id); if(!h) return; ultimoFoco = document.activeElement; uso('clique', 'hotel', { hotel:h.nome, noite:noiteN(M.dia) });
  $('#sh-nome').textContent = h.nome; $('#sh-sub').textContent = [h.base, h.cidade || cidade(h.base), h.categoria].filter(Boolean).join(' · ');
  const ha = iso=>{ if(!iso) return ''; const m = Math.max(0, Math.round((Date.now()-new Date(iso))/60000)); return m < 60 ? t('ha_min',{n:m}) : t('ha_h',{n:Math.round(m/60)}); };
  const noites = Array.from({length:DIAS}, (_,i)=>{ const nn = noiteN(i), l = livres(h,nn), d = dataN(i), f = folga(l,h.quartos_dia);
    return `<div class="nt${i===M.dia?' on':''}"><span>${esc(i===0?t('hoje'):i===1?t('amanha'):d.toLocaleDateString(loc(),{weekday:'short', day:'2-digit'}).replace('.',''))}</span><div class="barra"><i class="${f}" style="width:${h.quartos_dia?Math.round(l/h.quartos_dia*100):0}%"></i></div><b class="mono">${l} <em>/ ${h.quartos_dia}</em></b></div>`; }).join('');
  const d0 = M.disp[h.id+'|'+noiteN(M.dia)];
  $('#sh-b').innerHTML = `${h.aviso?`<div class="msg" style="background:var(--mid-soft);color:var(--mid)">⚠ ${esc(h.aviso)}</div>`:''}
    <div class="kv"><div><small>${esc(t('diaria'))}</small><b class="mono">${esc(moeda(h.tarifa, h.moeda))}</b></div><div><small>${esc(t('duplo'))}</small><b class="mono">${esc(moeda(h.tarifa_duplo, h.moeda))}</b></div>
      <div><small>${esc(t('quartos'))}</small><b class="mono">${h.quartos_dia}</b></div><div><small>${esc(t('cobre'))}</small><b class="mono">${h.duracao_h?h.duracao_h+'h':'—'}</b></div>
      <div><small>${esc(t('translado'))}</small><b class="mono">${h.minutos_local!=null?h.minutos_local+' min':'—'}</b></div><div><small>${esc(t('release'))}</small><b class="mono">${esc(h.release||'—')}</b></div></div>
    <div class="sh-tit">${esc(t('prox'))}</div><div class="noites">${noites}</div>
    ${d0?`<div class="rod" style="text-align:left">${esc(ha(d0.atualizado_em))}${/exemplo/.test(d0.fonte||'')?' · '+esc(t('exemplo')):''}</div>`:''}`;
  const fs = $('#fundo-sh'), sh = $('#sheet'); fs.hidden = false; sh.hidden = false; sh.style.transform = '';
  requestAnimationFrame(()=>{ fs.classList.add('on'); sh.classList.add('on'); $('#sh-x').focus(); });
  document.body.style.overflow = 'hidden';
}
function fecharFicha(){ const fs = $('#fundo-sh'), sh = $('#sheet'); if(sh.hidden) return; fs.classList.remove('on'); sh.classList.remove('on'); sh.style.transform = '';
  setTimeout(()=>{ fs.hidden = true; sh.hidden = true; }, 280); document.body.style.overflow = ''; if(ultimoFoco && ultimoFoco.focus) try{ ultimoFoco.focus({ preventScroll:true }); }catch(e){} }
$('#sh-x').addEventListener('click', fecharFicha); $('#fundo-sh').addEventListener('click', fecharFicha);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') fecharFicha(); });
// arrastar a alça para baixo fecha a ficha
(function(){ const pega = $('#sh-pega'), sh = $('#sheet'); let y0 = null, dy = 0;
  pega.addEventListener('pointerdown', e=>{ y0 = e.clientY; dy = 0; sh.style.transition = 'none'; pega.setPointerCapture(e.pointerId); });
  pega.addEventListener('pointermove', e=>{ if(y0==null) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; });
  const fim = ()=>{ if(y0==null) return; sh.style.transition = ''; y0 = null; if(dy > 90) fecharFicha(); else sh.style.transform = ''; };
  pega.addEventListener('pointerup', fim); pega.addEventListener('pointercancel', fim); })();

/* ---------- eventos ---------- */
document.addEventListener('click', e=>{
  const d = e.target.closest('[data-dia]'); if(d){ M.dia = +d.dataset.dia; desenhar(); d.scrollIntoView({ inline:'nearest', block:'nearest' }); const n = document.querySelector(`[data-dia="${M.dia}"]`); if(n) n.focus({ preventScroll:true }); return; }
  const f = e.target.closest('[data-f]'); if(f){ M.filtro = f.dataset.f; desenhar(); return; }
  if(e.target.closest('#p-ap')){ M.filtro = 'apertados'; desenhar(); $('#chips').scrollIntoView({ block:'start', behavior:'smooth' }); return; }
  const h = e.target.closest('[data-h]'); if(h){ abrirFicha(h.dataset.h); return; }
  const lg = e.target.closest('[data-lang]'); if(lg){ M.lang = lg.dataset.lang; ls.set('sl_idioma', M.lang); desenhar(); return; }
  if(e.target.closest('#b-sair')){ e.preventDefault(); sb.auth.signOut(); return; }
});
document.addEventListener('change', e=>{ if(e.target.id==='sel-base'){ M.base = e.target.value; ls.set('sl_m_base', M.base); desenhar(); } });
// setas do teclado trocam a noite (acessibilidade do role=tablist)
$('#dias').addEventListener('keydown', e=>{ if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return; e.preventDefault(); M.dia = Math.max(0, Math.min(DIAS-1, M.dia + (e.key==='ArrowRight'?1:-1))); desenhar(); const n = document.querySelector(`[data-dia="${M.dia}"]`); if(n){ n.focus(); n.scrollIntoView({ inline:'nearest', block:'nearest' }); } });
const bi = $('#busca'); let tb;
bi.addEventListener('input', ()=>{ $('#busca-x').hidden = !bi.value; clearTimeout(tb); tb = setTimeout(()=>{ M.busca = bi.value; desenhar(); }, 180); });
$('#busca-x').addEventListener('click', ()=>{ bi.value = ''; M.busca = ''; $('#busca-x').hidden = true; desenhar(); bi.focus(); });
$('#b-atual').addEventListener('click', ()=> carregar(true));
$('#b-tema').addEventListener('click', ()=>{ const n = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n; ls.set('sl_tema', n); });
window.addEventListener('scroll', ()=> $('#hd').classList.toggle('rolou', scrollY > 4), { passive:true });
// atualiza sozinho: a cada 5 min com a tela aberta, e ao voltar para o app depois de 2 min
setInterval(()=>{ if(iniciado && document.visibilityState==='visible') carregar(); }, ATUALIZA_MS);
document.addEventListener('visibilitychange', ()=>{ if(iniciado && document.visibilityState==='visible' && Date.now() - M.ultima > 2*60*1000) carregar(); });
// virou o dia com a tela aberta: volta para "hoje"
setInterval(()=>{ if(M.quando && iso(new Date()) !== iso(M.quando) && iniciado){ M.dia = 0; carregar(); } }, 60*1000);
aplicarIdioma();
})();
</script>
</body>
</html>
